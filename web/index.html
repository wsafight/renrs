<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RenRS</title></head>
<body>
  <header><h1 id="title">RenRS</h1><nav aria-label="Player tools">
    <button id="restart" title="New game" aria-label="New game"><i data-lucide="rotate-ccw"></i></button>
    <button id="rollback" title="Rollback" aria-label="Rollback"><i data-lucide="undo-2"></i></button>
    <button id="saves" title="Saves" aria-label="Saves"><i data-lucide="save"></i></button>
    <button id="history" title="History" aria-label="History"><i data-lucide="history"></i></button>
    <button id="collection" title="Collection" aria-label="Collection"><i data-lucide="images"></i></button>
    <button id="settings" title="Settings" aria-label="Settings"><i data-lucide="settings"></i></button>
    <button id="debug-toggle" title="Debugger" aria-label="Debugger"><i data-lucide="bug"></i></button>
  </nav></header>
  <main>
    <section id="game" aria-label="Story">
      <div id="stage"><img id="background" alt=""><div id="sprites"></div><video id="video" playsinline controls hidden></video></div>
      <div id="choices" role="group" aria-label="Choices"></div>
      <section id="dialogue" aria-live="polite"><strong id="speaker"></strong><p id="text"></p><footer><span id="chapter"></span><button id="next" title="Continue" aria-label="Continue"><i data-lucide="chevron-right"></i></button></footer></section>
    </section>
    <aside id="debug" hidden>
      <div class="debug-actions"><button id="resume" title="Resume" aria-label="Resume"><i data-lucide="play"></i></button><button id="step" title="Step instruction" aria-label="Step instruction"><i data-lucide="step-forward"></i></button><output id="coverage"></output><button id="export-coverage" title="Export coverage" aria-label="Export coverage"><i data-lucide="download"></i></button></div>
      <div id="graph" aria-label="Story graph"></div><output id="location"></output><pre id="variables"></pre><div id="instructions"></div>
    </aside>
  </main>
  <output id="notice" role="status" hidden></output>
  <dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button id="close" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div><div id="modal-body"></div></dialog>
  <script type="module" src="/src/main.ts"></script>
</body></html>
