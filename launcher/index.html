<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RenRS Launcher</title><script src="/src/main.ts" type="module"></script></head>
<body>
<header><strong>RenRS <span>Workspace</span></strong><button type="button" id="sdk-button" title="SDK 设置"><i data-lucide="settings-2"></i><span>SDK</span></button></header>
<div class="workspace">
<aside><div class="section-title"><h2>项目</h2><div class="tools"><button type="button" id="migrate" title="迁移 Ren'Py 项目" aria-label="迁移 Ren'Py 项目"><i data-lucide="import"></i></button><button type="button" id="register" title="添加已有项目" aria-label="添加已有项目"><i data-lucide="folder-open"></i></button><button type="button" id="new" title="新建项目" aria-label="新建项目"><i data-lucide="plus"></i></button></div></div><input id="search" type="search" placeholder="搜索项目" aria-label="搜索项目"><div id="projects"></div></aside>
<main>
<div class="project-header"><div><h1 id="project-name">RenRS</h1><p id="project-path">项目工作区</p></div><div class="tools"><button type="button" id="check" title="检查项目"><i data-lucide="check-check"></i><span>检查</span></button><button type="button" id="run" class="primary" title="运行项目"><i data-lucide="play"></i><span>运行</span></button></div></div>
<nav aria-label="项目视图"><button type="button" data-tab="overview" aria-pressed="true">概览</button><button type="button" data-tab="script" aria-pressed="false">脚本</button><button type="button" data-tab="quality" aria-pressed="false">质量</button><button type="button" data-tab="build" aria-pressed="false">构建</button><button type="button" data-tab="jobs" aria-pressed="false">任务 <span id="job-count">0</span></button></nav>
<section id="overview" class="view"><img id="preview" alt="项目场景" hidden><div class="details"><h2>项目文件</h2><div id="file-list"></div><button type="button" id="graph"><i data-lucide="workflow"></i>剧情图</button><button type="button" id="remove" class="subtle"><i data-lucide="folder-minus"></i>移出列表</button></div></section>
<section id="script" class="view" hidden><div class="editor-tools"><select id="scripts" aria-label="脚本文件"></select><button type="button" id="reload-script" title="重新载入脚本" aria-label="重新载入脚本"><i data-lucide="rotate-cw"></i></button><button type="button" id="save-script" title="保存脚本" aria-label="保存脚本"><i data-lucide="save"></i></button><span id="dirty"></span></div><textarea id="source" spellcheck="false" aria-label="脚本内容"></textarea></section>
<section id="quality" class="view" hidden><div class="quality-heading"><div><h2>项目质量</h2><p id="quality-status">选择项目后读取检查结果</p></div><button type="button" id="refresh-quality" title="重新检查" aria-label="重新检查"><i data-lucide="refresh-cw"></i></button></div><div class="quality-summary"><div><span>路线覆盖</span><strong id="coverage-value">—</strong></div><div><span>路线测试</span><strong id="route-value">—</strong></div><div><span>不可达标签</span><strong id="unreachable-value">—</strong></div><div><span>翻译缺失</span><strong id="locale-value">—</strong></div></div><progress id="coverage-bar" max="100" value="0" aria-label="路线指令覆盖率"></progress><div class="quality-section"><h3>迁移报告</h3><p id="migration-status" class="empty">当前项目没有迁移报告。</p><div id="migration-list" class="table-wrap"></div></div><div class="quality-section"><h3>诊断</h3><div id="diagnostic-list"></div></div><div class="quality-grid"><div class="quality-section"><h3>未覆盖标签</h3><div id="uncovered-list"></div></div><div class="quality-section"><h3>路线结果</h3><div id="route-list" class="table-wrap"></div></div></div><div class="quality-section"><h3>变量</h3><div id="variable-list" class="table-wrap"></div></div><div class="quality-section"><h3>本地化</h3><div id="locale-list" class="table-wrap"></div></div><div class="quality-section"><div class="impact-controls"><h3>影响分析</h3><select id="impact-baseline" aria-label="基线项目"></select><button type="button" id="run-impact"><i data-lucide="git-compare-arrows"></i>比较</button></div><p id="impact-status" class="empty">选择基线项目后比较。</p><div id="impact-list" class="table-wrap"></div></div></section>
<section id="build" class="view" hidden><h2>构建项目</h2><form id="build-form"><label>构建类型<select name="action"><option value="build">本机发行包</option><option value="web">Web 发行包</option><option value="pack">资源归档 .renrs</option></select></label><label>输出路径<input name="output" required placeholder="/path/to/new-output"></label><button type="submit" class="primary"><i data-lucide="package"></i>构建</button></form></section>
<section id="jobs" class="view" hidden><div id="jobs-list"></div></section>
<p id="status" role="status"></p>
</main></div>
<dialog id="dialog"><form id="dialog-form"><div class="section-title"><h2 id="dialog-title">操作</h2><button id="dismiss" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><button type="submit" class="primary" id="dialog-submit">确定</button></form></dialog>
</body></html>
