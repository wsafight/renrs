name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev xvfb libgl1-mesa-dri libxi6 libxcursor1 libxrandr2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Validate demo project
        run: cargo run --bin renrs-check -- demo

      - name: Check demo formatting
        run: cargo run --bin renrs-fmt -- --check demo

      - name: Check product workflows
        run: |
          cargo run --example generate_product_fixture -- "${{ runner.temp }}/renrs-product"
          cargo run --bin renrs-accept -- "${{ runner.temp }}/renrs-product"

      - name: Verify project creation and routes
        run: |
          cargo run --bin renrs-init -- "${{ runner.temp }}/renrs-story"
          cargo run --bin renrs-debug -- test "${{ runner.temp }}/renrs-story" "${{ runner.temp }}/renrs-story/routes.json"
          cargo run --bin renrs-debug -- explore "${{ runner.temp }}/renrs-story"

      - name: Build native visual fixture
        if: runner.os == 'Linux'
        run: |
          cargo build --bins
          cargo run --example generate_visual_fixture -- "${{ runner.temp }}/renrs-visual"
          target/debug/renrs-debug test "${{ runner.temp }}/renrs-visual" "${{ runner.temp }}/renrs-visual/routes.json"
          target/debug/renrs-build "${{ runner.temp }}/renrs-visual" "${{ runner.temp }}/renrs-package"

      - name: Verify native windows and packaged startup
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSA_CONFIG_PATH: ${{ github.workspace }}/scripts/ci-asound.conf
        working-directory: ${{ runner.temp }}
        run: |
          timeout 60s xvfb-run -a "${{ github.workspace }}/target/debug/renrs" "${{ github.workspace }}/demo" --smoke-test "${{ runner.temp }}/renrs-captures/demo" --window-size 1280x720
          timeout 60s xvfb-run -a "${{ runner.temp }}/renrs-package/renrs" --smoke-test "${{ runner.temp }}/renrs-captures/packaged" --window-size 800x600

      - name: Upload native captures
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-captures
          path: ${{ runner.temp }}/renrs-captures
          if-no-files-found: ignore

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-renrs/package-lock.json
      - run: npm ci
        working-directory: editors/vscode-renrs
      - run: npm run check
        working-directory: editors/vscode-renrs
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev xvfb
      - run: cargo build --bins
      - run: xvfb-run -a npm run test:host
        working-directory: editors/vscode-renrs
      - run: npm run package
        working-directory: editors/vscode-renrs
      - uses: actions/upload-artifact@v4
        with:
          name: renrs-vscode
          path: editors/vscode-renrs/*.vsix
