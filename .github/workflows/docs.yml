name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'demo/images/studio.png'
      - 'demo/images/mira.png'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'demo/images/studio.png'
      - 'demo/images/mira.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE }}
      DOCS_BASE: ${{ vars.DOCS_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Requires site/package-lock.json to stay in sync with package.json.
      # If this fails with EUSAGE (missing packages), regenerate the lockfile
      # with `npm install` in site/ and commit the result.
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm test
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renrs-docs
          path: site/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
