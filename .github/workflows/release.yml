name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins --target "${{ matrix.target }}"

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p "package-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/renrs${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-check${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-fmt${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-graph${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-lsp${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-i18n${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-migrate${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-pack${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-unpack${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-build${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-init${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-debug${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-bench${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-accept${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-web-build${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-video${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-compose${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp scripts/mobile.mjs "package-${{ matrix.name }}/"
          cp "target/${{ matrix.target }}/release/renrs-update${{ matrix.suffix }}" "package-${{ matrix.name }}/"
          cp -R demo "package-${{ matrix.name }}/demo"
          cp README.md LICENSE "package-${{ matrix.name }}/"
          cp assets/fonts/OFL.txt "package-${{ matrix.name }}/LICENSE-font-OFL.txt"
          cp -R docs "package-${{ matrix.name }}/docs"
          cargo run --release --bin renrs-pack -- demo "package-${{ matrix.name }}/demo.renrs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle Web player and author extension
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked --root target/web-tools
          npm ci --prefix web
          node scripts/build-web.mjs
          cp -R web/dist "package-${{ matrix.name }}/web-shell"
          npm ci --prefix editors/vscode-renrs
          npm run package --prefix editors/vscode-renrs
          cp editors/vscode-renrs/*.vsix "package-${{ matrix.name }}/"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: renrs-${{ matrix.name }}
          path: package-${{ matrix.name }}
          if-no-files-found: error
