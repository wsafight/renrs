[package]
name = "renrs-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "renrs"
description = "Native RenRS player"

[[bin]]
name = "renrs"
path = "src/main.rs"

[dependencies]
renrs = { path = "../.." }
renrs-project.workspace = true
renrs-runtime.workspace = true
image = { version = "0.24", default-features = false, features = ["png", "tga"] }
macroquad = { version = "0.4.14" }
ab_glyph = "0.2.32"
etagere = "0.2.15"
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
unicode-script = "0.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
notify = "8.2"
hound = "3.5"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound", "lewton"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSGraphicsContext"] }

[lints]
workspace = true
