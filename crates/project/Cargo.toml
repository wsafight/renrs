[package]
name = "renrs-project"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
renrs-compiler = { path = "../compiler" }
renrs-extensions = { path = "../extensions" }
indexmap = { version = "2.11", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3.22"

[lints]
workspace = true
