[package]
name = "renrs"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.88"
default-run = "renrs"
description = "A small visual novel engine inspired by Ren'Py, written in Rust"
license = "MIT"
repository = "https://github.com/wsafight/renrs"
homepage = "https://wsafight.github.io/renrs/"

[workspace]
members = ["crates/syntax", "crates/model", "crates/compiler", "crates/runtime", "crates/project", "crates/editor", "crates/web", "crates/extensions"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
renrs-compiler = { path = "crates/compiler" }
renrs-editor = { path = "crates/editor" }
renrs-extensions = { path = "crates/extensions" }
renrs-model = { path = "crates/model" }
renrs-project = { path = "crates/project" }
renrs-runtime = { path = "crates/runtime" }
renrs-syntax = { path = "crates/syntax" }
indexmap = { version = "2.11", features = ["serde"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3.22"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
renrs-model.workspace = true
renrs-compiler.workspace = true
renrs-runtime.workspace = true
renrs-project.workspace = true
renrs-editor.workspace = true
renrs-syntax.workspace = true
indexmap.workspace = true
hound = "3.5"
lewton = "0.9"
image = { version = "0.24", default-features = false, features = ["png", "tga"] }
macroquad = { version = "0.4.14" }
ab_glyph = "0.2.32"
etagere = "0.2.15"
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
unicode-script = "0.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
ed25519-dalek = "2.2"
getrandom = "0.3"
notify = "8.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound", "lewton"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSGraphicsContext"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
